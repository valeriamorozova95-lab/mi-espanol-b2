<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Español B2 · Studio</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#263547;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#203c54,#427b78);color:white;padding:32px max(20px,calc((100vw - 1060px)/2));}h1{font-size:36px;margin:6px 0}header p{opacity:.85}main{max-width:1060px;margin:24px auto;padding:0 18px}.stats,.layout{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{background:white;border:1px solid #e3e9f0;border-radius:20px;padding:20px;box-shadow:0 6px 20px #23344a0b}.stat strong{display:block;font-size:30px;color:#2c7974}.stat small{color:#687789}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#e9f0f3;color:#244154;font-weight:650}button.active,button.primary{background:#267c75;color:white}button:disabled{opacity:.5;cursor:default}.panel{min-height:320px}.hidden{display:none}.pill{display:inline-block;background:#e9f3ef;color:#24736d;padding:7px 12px;border-radius:30px;font-size:13px}.flash{min-height:180px;display:grid;place-items:center;text-align:center;border-radius:20px;background:linear-gradient(130deg,#edf6f3,#eef0fc);margin:18px 0;cursor:pointer;font-size:27px;font-weight:700;padding:20px}.options{display:grid;gap:10px;margin:18px 0}.option{background:#f2f6f9;text-align:left;border:1px solid #dce5eb}.option.selected{border-color:#257d75;background:#d9f0e9}.option.good{background:#d6f3e5}.option.bad{background:#fbe0df}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#edf5f2}.bar{height:10px;background:#e7edf2;border-radius:10px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#2b9883;transition:width .3s}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{min-height:55px}.match .done{background:#d5f1e4;color:#216f53}.days{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.muted{color:#647387}a{color:inherit}footer{max-width:1060px;margin:35px auto;padding:15px;color:#647387}@media(max-width:650px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat strong{font-size:23px}h1{font-size:29px}.panel{padding:15px}}
</style></head><body><div style="position:relative;z-index:30;background:#e4f0d9;padding:15px;text-align:center;border-bottom:2px solid #7eab85"><a href="../games/index.html" style="font-size:18px;font-weight:800;color:#235d42">🌷 Новый Game World: семь игр для испанского B2 →</a></div><header><div class="pill">Español con Valeria · Personal studio</div><h1>Mi Español B2 ✨</h1><p>Aprende · Practica · Avanza — твоя интерактивная языковая студия</p></header><main><div class="stats"><div class="stat"><strong id="known">0/30</strong><small>Освоено выражений</small></div><div class="stat"><strong id="accuracy">0%</strong><small>Точность ответов</small></div><div class="stat"><strong id="done">0</strong><small>Заданий выполнено</small></div></div><nav id="nav"></nav><section class="panel" id="panel"></section></main><footer>Прогресс сохраняется в этом браузере. <a href="../index.html">← К прежним материалам B2</a></footer><script>
const DATA={"words":[["dar por hecho","считать само собой разумеющимся"],["estar al tanto","быть в курсе"],["echar de menos","скучать по"],["llevar a cabo","осуществлять"],["hacer hincapié","подчёркивать"],["poner en duda","ставить под сомнение"],["salir adelante","справиться с трудностями"],["tomar medidas","принимать меры"],["darse cuenta","осознавать"],["estar harto de","быть сытым по горло"],["tener en cuenta","принимать во внимание"],["a pesar de","несмотря на"],["sin embargo","однако"],["por lo tanto","следовательно"],["de hecho","на самом деле"],["plantear","поднимать вопрос"],["aprovechar","использовать с пользой"],["alcanzar","достигать"],["afrontar","противостоять"],["desempeñar","выполнять роль"],["lograr","добиваться"],["rechazar","отвергать"],["respaldar","поддерживать"],["carecer de","не иметь"],["conllevar","влечь за собой"],["resultar","оказываться"],["fomentar","способствовать"],["surgir","возникать"],["cuestionar","подвергать сомнению"],["matizar","уточнять нюансы"]],"grammar":[["No creo que ella ___ razón.",["tiene","tenga","tuvo"],1,"После no creo que нужен subjuntivo."],["Si ___ más tiempo, viajaría.",["tendría","tenga","tuviera"],2,"Нереальное условие: imperfecto de subjuntivo."],["Cuando llegué, ya ___ salido.",["había","ha","hubiera"],0,"Действие до другого прошлого: pluscuamperfecto."],["Aunque ___ mañana, iremos.",["llueve","llueva","llovió"],1,"Гипотетическое будущее после aunque."],["Me alegro de que ___ venido.",["has","hayas","habías"],1,"Эмоциональная оценка: perfecto de subjuntivo."],["Busco a alguien que ___ francés.",["habla","hable","habló"],1,"Неопределённый референт: subjuntivo."]],"dialogs":[{"q":"Tu compañero se atribuye tu trabajo. ¿Qué dices?","o":["Quisiera aclarar que este proyecto lo desarrollamos juntos.","¡Siempre eres un ladrón!"],"a":0,"e":"Выбирай дипломатичное уточнение с condicional."},{"q":"No estás de acuerdo con una propuesta. ¿Cómo respondes?","o":["Eso es una tontería.","Entiendo tu punto, pero habría que considerar otra opción."],"a":1,"e":"Уважительное несогласие и condicional."},{"q":"Te ofrecen un trabajo, pero necesitas más detalles.","o":["¿Podrías concretar cuáles serían mis responsabilidades?","Dime ya cuánto pagan."],"a":0,"e":"Вежливая просьба уточнить обязанности."}]};
const KEY='mi-b2-studio-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state.known=state.known||{};state.results=state.results||{};state.day=state.day||0;let tab='Карточки',idx=0,flip=false,matchA=null,matchPairs=[],matchSolved=[],question=0,selected=null;
const tabs=['Карточки','Сопоставление','Грамматика','Диалоги','Прогресс'];const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));stats()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>DATA.words.slice(state.day*6,state.day*6+6);const resultKey=()=>tab==='Грамматика'?'g'+question:'d'+question;
function stats(){let r=Object.values(state.results),correct=r.filter(x=>x).length;$('known').textContent=Object.values(state.known).filter(Boolean).length+'/30';$('accuracy').textContent=r.length?Math.round(correct/r.length*100)+'%':'0%';$('done').textContent=r.length}
function render(){stats();$('nav').innerHTML=tabs.map(t=>'<button class="'+(tab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;idx=0;flip=false;question=0;selected=null;matchPairs=[];matchSolved=[];matchA=null;render()});const p=$('panel');if(tab==='Карточки')cards(p);if(tab==='Сопоставление')matching(p);if(tab==='Грамматика')quiz(p,false);if(tab==='Диалоги')quiz(p,true);if(tab==='Прогресс')progress(p)}
function days(){return '<div class="days">'+['Пн','Вт','Ср','Чт','Пт'].map((d,i)=>'<button class="'+(state.day===i?'active':'')+'" data-day="'+i+'">'+d+'</button>').join('')+'</div>'}
function wireDays(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;idx=0;flip=false;matchPairs=[];matchSolved=[];matchA=null;save();render()})}
function cards(p){let w=today()[idx],n=state.day*6+idx;p.innerHTML='<h2>Flashcards</h2><p class="muted">6 выражений в день · нажми на карточку, чтобы перевернуть</p>'+days()+'<p class="muted">Карточка '+(idx+1)+' / 6</p><div class="flash" id="flash">'+esc(flip?w[1]:w[0])+'</div><div class="days"><button id="prev">← Назад</button><button id="next">Далее →</button><button class="primary" id="mark">'+(state.known[n]?'✓ Выучено':'✓ Знаю')+'</button><button id="unmark">Повторить</button></div>';wireDays();$('flash').onclick=()=>{flip=!flip;cards(p)};$('prev').onclick=()=>{idx=(idx+5)%6;flip=false;cards(p)};$('next').onclick=()=>{idx=(idx+1)%6;flip=false;cards(p)};$('mark').onclick=()=>{state.known[n]=true;save();idx=(idx+1)%6;flip=false;cards(p)};$('unmark').onclick=()=>{state.known[n]=false;save();idx=(idx+1)%6;flip=false;cards(p)}}
function matching(p){if(!matchPairs.length){matchPairs=today().flatMap((w,i)=>[{id:i,side:0,text:w[0]},{id:i,side:1,text:w[1]}]).sort(()=>Math.random()-.5)}p.innerHTML='<h2>Match & Play</h2><p class="muted">Соедини выражения с переводами</p>'+days()+'<p>Найдено пар: '+matchSolved.length+'/6</p><div class="match">'+matchPairs.map((w,i)=>'<button data-match="'+i+'" class="'+(matchSolved.includes(w.id)?'done':'')+'" '+(matchSolved.includes(w.id)?'disabled':'')+'>'+esc(w.text)+'</button>').join('')+'</div><p id="matchmsg" class="feedback hidden"></p><div class="days"><button id="reset">Перемешать заново</button></div>';wireDays();document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{let i=+b.dataset.match,w=matchPairs[i];if(matchA===null){matchA=i;b.classList.add('selected');return}let a=matchPairs[matchA];if(a.id===w.id&&a.side!==w.side){matchSolved.push(w.id);matchA=null;if(matchSolved.length===6){state.results['m'+state.day]=true;save()}matching(p)}else{matchA=null;document.querySelectorAll('[data-match]').forEach(x=>x.classList.remove('selected'));$('matchmsg').textContent='Не совпало — попробуй ещё!';$('matchmsg').classList.remove('hidden')}});$('reset').onclick=()=>{matchPairs=[];matchSolved=[];matchA=null;matching(p)}}
function quiz(p,dialog){let data=dialog?DATA.dialogs:DATA.grammar;if(question>=data.length)question=0;let t=data[question],q=dialog?t.q:t[0],o=dialog?t.o:t[1],a=dialog?t.a:t[2],e=dialog?t.e:t[3],key=resultKey(),checked=Object.hasOwn(state.results,key);p.innerHTML='<h2>'+(dialog?'Diálogos':'Grammar Lab')+'</h2><p class="muted">Задание '+(question+1)+' / '+data.length+'</p><div class="bar"><div class="fill" style="width:'+Math.round((question+1)/data.length*100)+'%"></div></div><h3>'+esc(q)+'</h3><div class="options">'+o.map((x,i)=>'<button class="option '+(checked?(i===a?'good':i===selected?'bad':''):'')+'" data-opt="'+i+'" '+(checked?'disabled':'')+'>'+esc(x)+'</button>').join('')+'</div>'+(checked?'<p class="feedback">'+(state.results[key]?'✓ ¡Muy bien!':'Правильный ответ: '+esc(o[a]))+'<br>'+esc(e)+'</p>':'<button class="primary" id="check" '+(selected===null?'disabled':'')+'>Проверить</button>')+'<div class="days"><button id="back">← Назад</button><button id="forward">Далее →</button></div>';document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{selected=+b.dataset.opt;document.querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('selected',x===b));$('check').disabled=false});if(!checked)$('check').onclick=()=>{state.results[key]=selected===a;save();quiz(p,dialog)};$('back').onclick=()=>{question=(question+data.length-1)%data.length;selected=null;quiz(p,dialog)};$('forward').onclick=()=>{question=(question+1)%data.length;selected=null;quiz(p,dialog)}}
function progress(p){let known=Object.values(state.known).filter(Boolean).length;let completed=Object.keys(state.results).length;p.innerHTML='<h2>Mi progreso</h2><p>Лексика: '+known+' из 30 выражений</p><div class="bar"><div class="fill" style="width:'+(known/30*100)+'%"></div></div><p>Выполнено заданий: '+completed+'</p><p>Прогресс по дням:</p>'+['Понедельник','Вторник','Среда','Четверг','Пятница'].map((d,i)=>{let count=Array.from({length:6},(_,j)=>state.known[i*6+j]).filter(Boolean).length;return '<p>'+d+' — '+count+'/6</p><div class="bar"><div class="fill" style="width:'+(count/6*100)+'%"></div></div>'}).join('')+'<p class="muted">Данные хранятся локально на этом устройстве.</p>'}
render();
</script></body></html>
